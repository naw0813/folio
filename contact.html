
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <a href="index.html" class="logo">
        <img src="logos/blue-logo.png" alt="Logo">
    </a>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="portfolio.html">portfolio</a>
        <a href="contact.html" class="active">Contact</a>
    </nav>
</header>

<main class="page contact-page">

    <p class="eyebrow">03 / GET IN TOUCH</p>

    <h1 class="page-title">
        HAVE AN<br>
        IDEA? <span>LET'S TALK.</span>
    </h1>

    <p class="contact-description">
        Have a project in mind or simply want to say hello?
        I'd love to hear from you.
    </p>

    <div class="contact-details">
        <p>EMAIL</p>
        <a href="mailto:yourname@email.com">
            yourname@email.com ↗
        </a>

        <p>LOCATION</p>
        <h3>Your City, Country</h3>

        <p>SOCIAL MEDIA</p>
        <a href="#">Instagram ↗</a>
        <a href="#">LinkedIn ↗</a>
    </div>

    <form action="mailto:yourname@email.com"
          method="post"
          enctype="text/plain">

        <input type="text" name="name"
               placeholder="Your Name" required>

        <input type="email" name="email"
               placeholder="Your Email" required>

        <textarea name="message"
                  placeholder="Tell me about your project..."
                  required></textarea>

        <button type="submit">SEND MESSAGE ↗</button>
    </form>

</main>

<footer>
    <p>© 2026 YOUR NAME</p>
    <p>DESIGNED WITH PURPOSE.</p>
</footer>

</body>
</html>
